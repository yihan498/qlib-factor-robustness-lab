[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qlib-factor-robustness-lab"
version = "0.1.0"
description = "Leakage-aware factor stability research built on Microsoft Qlib"
license = {file = "LICENSE"}
authors = [{name = "Tian Yihan"}]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.9",
]
qlib = [
  "pyqlib==0.9.7",
  "lightgbm==4.7.0",
]
showcase = [
  "matplotlib>=3.8",
  "reportlab>=5.0",
  "pdfplumber>=0.11",
  "pypdf>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py312"
