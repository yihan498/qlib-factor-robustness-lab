data_path: data/qlib/cn_data
universe: csi300
benchmark: SH000300
runtime_kernels: 4
periods:
  train: [2014-01-01, 2015-12-31]
  validation: [2016-01-01, 2016-12-31]
  test: [2017-01-01, 2020-08-01]
label_information_lag: 2
top_factors: 30
minimum_assets_per_ic: 30
candidate_grid:
  windows: [60, 120]
  uncertainty_penalties: [0.5, 1.0]
  shrinkage_to_dynamic: [0.25, 0.5, 0.75]
backtest:
  topk: 50
  n_drop: 5
  account: 100000000
  exchange_kwargs:
    limit_threshold: 0.095
    deal_price: close
    open_cost: 0.0005
    close_cost: 0.0015
    min_cost: 5
research_promotion_gate:
  minimum_test_days: 500
  minimum_rank_ic: 0.0
  minimum_rank_icir: 0.5
  minimum_after_cost_annualized_excess: 0.0
  minimum_after_cost_information_ratio: 0.0
  maximum_drawdown_floor: -0.30
  minimum_return_advantage_vs_control: 0.0
  minimum_ir_advantage_vs_control: 0.0
